<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-aware brain activity signal</title>
  <desc id="desc">A quiet local activity diagram with two active observation nodes and one source-confirmation link.</desc>
  <defs>
    <linearGradient id="brainFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123244"/>
      <stop offset="1" stop-color="#17213c"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71d7d0" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#71d7d0"/>
      <stop offset="1" stop-color="#ae9cff"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="#274862" stroke-width="1" opacity=".7">
    <path d="M20 207H500"/>
    <path d="M20 177H500" stroke-dasharray="2 9"/>
    <path d="M20 147H500" stroke-dasharray="2 9"/>
    <path d="M20 117H500" stroke-dasharray="2 9"/>
    <path d="M20 87H500" stroke-dasharray="2 9"/>
  </g>
  <g opacity=".9">
    <path d="M73 202 C105 170 108 153 108 128 C108 93 134 59 170 57 C191 28 240 30 258 53 C284 25 329 38 338 69 C375 66 400 99 391 129 C409 152 393 188 368 202Z" fill="url(#brainFill)" stroke="#71d7d0" stroke-opacity=".6" stroke-width="2"/>
    <path d="M258 54 C245 73 248 90 258 106 C266 123 260 146 257 162 C251 181 256 194 264 202" fill="none" stroke="#71d7d0" stroke-opacity=".55" stroke-width="2"/>
    <path d="M114 113 C138 102 153 113 160 129 C169 147 154 163 135 160 M175 69 C166 89 174 104 193 111 M190 132 C205 112 228 116 234 134 C239 150 229 162 216 172 M290 75 C280 93 289 110 307 116 C321 121 327 136 318 148 M336 99 C318 105 315 124 329 136 C343 148 350 165 341 180 M282 170 C299 155 319 163 321 181" fill="none" stroke="#ae9cff" stroke-opacity=".72" stroke-width="2" stroke-linecap="round"/>
  </g>
  <g fill="none" stroke="url(#signal)" stroke-linecap="round">
    <path d="M32 213 C56 213 55 185 77 185 S97 218 119 218 S142 170 165 170 S184 211 205 211 S229 156 250 156 S275 202 298 202 S317 177 340 177 S363 218 388 218 S410 173 437 173 S463 211 488 211" stroke-width="3" filter="url(#glow)"/>
    <path d="M33 213 C56 213 55 185 77 185 S97 218 119 218 S142 170 165 170 S184 211 205 211 S229 156 250 156 S275 202 298 202 S317 177 340 177 S363 218 388 218 S410 173 437 173 S463 211 488 211" stroke-width="1"/>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" fill="#8da6be">
    <text x="26" y="235">source</text><text x="218" y="235">interpretation</text><text x="407" y="235">review</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="151" cy="130" r="5" fill="#71d7d0"/>
    <circle cx="324" cy="132" r="5" fill="#ae9cff"/>
    <circle cx="392" cy="186" r="5" fill="#f4c96b"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" fill="#dbe9fa">
    <text x="133" y="115">active</text><text x="305" y="117">active</text><text x="367" y="207">waiting</text>
  </g>
</svg>
